apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/shreg10/Devops_assignment.git
    targetRevision: main
    path: task1/helm/postgres

  destination:
    server: https://kubernetes.default.svc
    namespace: application

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
