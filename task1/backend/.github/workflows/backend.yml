name: Backend CI

on:
  push:
    paths:
      - 'task1/backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set tag
      run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Build
      run: |
        docker build -t shreg10/backend:$TAG task1/backend

    - name: Push
      run: |
        docker push shreg10/backend:$TAG

    - name: Update Helm values
      run: |
        sed -i "s/tag:.*/tag: $TAG/" task1/helm/backend/values.yaml

    - name: Commit values change
      run: |
        git config user.name github-actions
        git config user.email github@github.com
        git add task1/helm/backend/values.yaml
        git commit -m "update backend image $TAG"
        git push
